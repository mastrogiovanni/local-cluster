# ingress-root certificate. Rendered by `make tls` from config.toml ([ingress]).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingress-root
  namespace: {{ cluster.namespace }}
spec:
  secretName: {{ ingress.tls_secret }}
  issuerRef:
    name: {{ ingress.tls_issuer_ref }}
    kind: ClusterIssuer
  dnsNames:
  - {{ ingress.host }}
