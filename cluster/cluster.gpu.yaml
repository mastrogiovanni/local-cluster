# GPU-enabled Kind cluster (NVIDIA Container Toolkit on the host required).
# Use: make down && make up WITH_GPU=1
# Recreate after any change to this file.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.nvidia]
      runtime_type = "io.containerd.runc.v2"
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.nvidia.options]
        BinaryName = "/usr/bin/nvidia-container-runtime"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,nvidia.com/gpu.present=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
    extraMounts:
      - hostPath: __DATA_PLANE_HOST__
        containerPath: /data-plane
      - hostPath: __SPRAR_HOST__
        containerPath: /sprar-src
      # Kind GPU injection (requires accept-nvidia-visible-devices-as-volume-mounts=true
      # in /etc/nvidia-container-runtime/config.toml). The host path does not need to
      # exist as a directory; /dev/null satisfies the runtime mount contract.
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/all
      - hostPath: /usr/bin/nvidia-container-runtime
        containerPath: /usr/bin/nvidia-container-runtime
      - hostPath: /usr/bin/nvidia-container-cli
        containerPath: /usr/bin/nvidia-container-cli
      - hostPath: /usr/bin/nvidia-container-runtime-hook
        containerPath: /usr/bin/nvidia-container-runtime-hook
      - hostPath: /usr/bin/nvidia-container-toolkit
        containerPath: /usr/bin/nvidia-container-toolkit
      - hostPath: /usr/bin/nvidia-cdi-hook
        containerPath: /usr/bin/nvidia-cdi-hook
