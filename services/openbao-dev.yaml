# Shared OpenBao in dev mode: in-memory, unsealed, root token from Secret openbao/root-token.
# Data is lost whenever the pod restarts.
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: {{ services.namespace }}
  labels:
    app: openbao
spec:
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  selector:
    app: openbao
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: {{ services.namespace }}
  labels:
    app: openbao
    app.kubernetes.io/part-of: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      containers:
        - name: openbao
          image: {{ services.openbao.image }}
          command: ["sh", "-c"]
          args:
            - exec bao server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id="$BAO_DEV_ROOT_TOKEN"
          env:
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
            - name: SKIP_SETCAP
              value: "true"
            - name: BAO_DEV_ROOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao
                  key: root-token
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
