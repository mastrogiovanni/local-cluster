apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: htpasswd
spec:
  secretName: htpasswd
  dnsNames:
    - htpasswd
    - htpasswd.projectcontour-auth
    - htpasswd.projectcontour-auth.svc
    - htpasswd.projectcontour-auth.svc.cluster.local
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
